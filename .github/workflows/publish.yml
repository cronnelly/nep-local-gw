# Builds the container image on every push and pull request; pushes it to
# ghcr.io/<owner>/nep-local-gw only for version tags (v0.1.0 → image tags
# 0.1.0 and latest). The git tag must match nep-gw/Cargo.toml's version.
name: Publish image

on:
  push:
    branches: [public]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' nep-gw/Cargo.toml | head -1)
          [ "v$crate" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != crate version $crate"; exit 1; }

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{version}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

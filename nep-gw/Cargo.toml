[package]
name = "nep-gw"
version = "0.1.0"
edition = "2021"

[dependencies]
nep-protocol = { path = "../nep-protocol" }
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
chrono = "0.4"
rumqttc = "0.24"
prometheus = { version = "0.13", features = ["process"] }
lazy_static = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
